  <circle cx="318" cy="134" r="6" fill="#fde047" opacity="0.85" />
  <circle cx="288" cy="88" r="5" fill="#fb923c" opacity="0.8" />
  <circle cx="220" cy="96" r="4.5" fill="#fef08a" opacity="0.8" />
